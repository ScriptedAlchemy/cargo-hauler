name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '24'
            name: check (ubuntu-latest)
          - os: macos-latest
            node: '24'
            name: check (macos-latest)
          - os: ubuntu-latest
            node: '22.19.0'
            name: check (Node 22.19.0)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install package tooling
        # npm 10 runs prepare during pack even with --ignore-scripts, which
        # breaks the source-free packed-install fixture. Match release npm.
        run: npm install --global npm@11.19.1 "$(node -p "require('./package.json').packageManager")"

      - name: Ensure Rust toolchain
        shell: bash
        run: |
          # The rstest eval suite drives real `cargo` against the offline
          # fixture workspaces under evals/; macOS runner images no longer
          # ship Rust, so install a minimal stable toolchain when missing.
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: Show toolchain versions
        run: |
          node --version
          npm --version
          pnpm --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Verify the GitHub worker boundary with Docker
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        env:
          HAULER_SANDBOX_TEST_IMAGE: node:22-bookworm-slim
          HAULER_SANDBOX_TEST_SNAPSHOT: >-
            {"repository":"octocat/Hello-World","snapshot":{"pr":11301,"base":"7fd1a60b01f91b314f59955a4e4d4e80d8edf11d","head":"4657431aec0fec59a58e13cd90054fb4e8bcfcd3","merge":"b08ed73837f427d56d8cfc7e05f6944096f2766c"}}
        run: node --test tests/github-action/sandbox.test.mjs
