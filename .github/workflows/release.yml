name: Release

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.repository == 'ScriptedAlchemy/cargo-hauler'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      - name: Install release tooling
        run: npm install --global npm@11.19.1 "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks
        run: pnpm check

      - name: Commit generated host outputs
        run: |
          git add artifact .claude-plugin/marketplace.json .agents/plugins/marketplace.json .cursor-plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: refresh generated repository plugin'
            git push origin HEAD:master
          fi

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm release:version
          publish-script: pnpm release:publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push-with-git-cli: true

      # Green must mean published. Once no changesets are pending, the version
      # in package.json is the one that should be on npm, whether this run
      # published it or an earlier one did; a silent publish failure is red.
      - name: Verify package.json version resolves on npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { setTimeout as delay } from 'node:timers/promises';

          const { name, version } = JSON.parse(await readFile('package.json', 'utf8'));
          const endpoint = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          // npm finalized the previous release more than six minutes after upload.
          for (let attempt = 1; attempt <= 40; attempt++) {
            const url = new URL(endpoint);
            url.searchParams.set('release-verification', `${Date.now()}-${attempt}`);
            try {
              const response = await fetch(url, {
                headers: { 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(10_000),
              });
              if (response.ok) {
                const metadata = await response.json();
                if (metadata.name === name && metadata.version === version) {
                  console.log(`registry ${name}@${version}`);
                  process.exit(0);
                }
              }
            } catch {}
            console.log(`attempt ${attempt}: registry has not confirmed ${name}@${version}`);
            if (attempt < 40) await delay(15_000);
          }
          console.error(`::error::Registry did not confirm ${name}@${version} after bounded visibility retries.`);
          process.exit(1);
          NODE
