<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cargo-hauler</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e4d9;
        --muted: #9a9384;
        --line: rgba(232, 228, 217, 0.12);
        --panel: #16130f;
        --accent: #e3b341;
        --good: #7dce9a;
        --bad: #e07a5f;
        --warn: #e39a55;
        --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      html, body {
        margin: 0;
        min-height: 100%;
        background: #100e0b;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      }
      body { padding: 20px 26px 30px; }
      main { max-width: 1060px; margin: 0 auto; }
      header { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
      h1 { margin: 0; font-size: 1.3rem; letter-spacing: 0.03em; }
      #status { color: var(--muted); font-size: 0.9rem; }
      .grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 18px; }
      section {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 4px;
        padding: 16px 18px 18px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 0.76rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      h2 .count { color: var(--muted); letter-spacing: 0.06em; }
      .window-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0;
        letter-spacing: 0;
      }
      .window-dot {
        color: var(--muted);
        margin: 0 4px;
      }
      .window-button {
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.74rem;
        letter-spacing: 0;
        text-transform: none;
      }
      .window-button:hover {
        border: 0;
        color: var(--ink);
      }
      .window-button.active {
        color: var(--accent);
      }
      table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
      th, td { text-align: left; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
      th { color: var(--muted); font-weight: 500; font-size: 0.8rem; }
      th.numeric, td.numeric { text-align: right; padding-right: 14px; }
      .empty { color: var(--muted); margin: 6px 0 0; font-size: 0.88rem; }
      .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.72rem; }
      .pill.done { background: rgba(125, 206, 154, 0.14); color: var(--good); }
      .pill.failed { background: rgba(224, 122, 95, 0.16); color: var(--bad); }
      .pill.killed { background: rgba(227, 154, 85, 0.16); color: var(--warn); }
      .pill.orphaned { background: rgba(227, 154, 85, 0.16); color: var(--warn); }
      /* Denied (hook-blocked, cargo never ran) must not read as failed or
         killed: outline instead of fill keeps the three ends distinct. */
      .pill.denied { background: transparent; border: 1px solid rgba(224, 122, 95, 0.45); color: var(--bad); }
      .pill.neutral { background: rgba(232, 228, 217, 0.1); color: var(--muted); }
      .badge {
        display: inline-block;
        margin-left: 6px;
        padding: 0 6px;
        border-radius: 999px;
        font-family: var(--mono);
        font-size: 0.68rem;
        white-space: nowrap;
      }
      .badge.err { background: rgba(224, 122, 95, 0.16); color: var(--bad); }
      .badge.warn { background: rgba(227, 154, 85, 0.16); color: var(--warn); }
      tr.selectable { cursor: pointer; }
      tr.selectable:hover td { background: rgba(232, 228, 217, 0.045); }
      tr.selectable:hover .ticket { color: var(--accent); }
      .down-cue { color: var(--bad); margin: 4px 0 0; font-size: 0.88rem; }
      .down-cue code { font-family: var(--mono); font-size: 0.8rem; color: var(--ink); }
      /* Three lines retain distinguishing command context without letting one
         filter-heavy run resize every table. Full argv stays in the tooltip
         and ticket drawer; measured truncation adds the subtle overlay hint. */
      .cmd-wrap {
        position: relative;
        display: inline-block;
        max-width: 520px;
        vertical-align: bottom;
      }
      .cmd {
        font-family: var(--mono);
        font-size: 0.8rem;
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        max-width: 520px;
        overflow: hidden;
        overflow-wrap: anywhere;
      }
      .cmd-truncated {
        position: absolute;
        right: 0;
        bottom: 0;
        padding-left: 14px;
        background: linear-gradient(90deg, transparent, var(--panel) 22%);
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.66rem;
        line-height: 1.88;
        pointer-events: none;
      }
      .ranas { color: var(--accent); font-size: 0.76rem; margin-top: 4px; }
      .ranas .cmd-wrap { max-width: 460px; }
      .ranas .cmd { max-width: 460px; font-size: 0.76rem; }
      /* One line of a running ticket's live output (the status preview);
         the whole tail is in the drawer. */
      .tail-preview {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.72rem;
        margin-top: 4px;
        max-width: 520px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pkgcount { color: var(--muted); }
      .ticket { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
      .who {
        color: var(--muted);
        font-size: 0.82rem;
        white-space: nowrap;
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        display: inline-block;
        vertical-align: bottom;
      }
      .dur { font-family: var(--mono); font-size: 0.8rem; white-space: nowrap; }
      .est { color: var(--muted); font-size: 0.76rem; white-space: nowrap; }
      .chip {
        display: inline-block;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 7px;
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .path {
        font-family: var(--mono);
        font-size: 0.8rem;
        display: inline-block;
        max-width: 340px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
      }
      .stats { display: flex; gap: 16px 28px; flex-wrap: wrap; align-items: flex-end; }
      .stats + .stats { margin-top: 16px; }
      .stat { min-width: 96px; }
      .stat b { display: block; font-size: 1.3rem; }
      .stat span { color: var(--muted); font-size: 0.78rem; }
      .meterstat { min-width: 150px; }
      .meter {
        margin-top: 5px;
        height: 6px;
        width: 140px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .meter-fill { height: 100%; background: var(--accent); }
      .mini-meter {
        display: inline-block;
        width: 48px;
        height: 3px;
        margin: 0 0 2px 7px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .mini-meter-fill { height: 100%; background: var(--accent); }
      .kache-section .stats { margin-bottom: 16px; }
      .wait-vs-run { margin-top: 18px; }
      .wait-vs-run .stats { margin-bottom: 10px; }
      /* Queue wait by cause: one bar, three causes, so the lane/permit share
         reads at a glance next to the totals above it. */
      .wait-split {
        display: flex;
        height: 8px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .wait-split-fill.lane { background: var(--accent); }
      .wait-split-fill.permit { background: var(--warn); }
      .wait-split-fill.other { background: rgba(232, 228, 217, 0.28); }
      .wait-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 18px;
        margin-top: 6px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.74rem;
      }
      .swatch {
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 6px;
        border-radius: 2px;
        vertical-align: -1px;
      }
      .swatch.lane { background: var(--accent); }
      .swatch.permit { background: var(--warn); }
      .swatch.other { background: rgba(232, 228, 217, 0.28); }
      .phase-split { color: var(--muted); }
      .warn-line {
        margin: 0 0 8px;
        color: var(--warn);
        font-size: 0.84rem;
      }
      .live-note {
        color: var(--warn);
        font-size: 0.74rem;
        letter-spacing: 0.04em;
        margin: 0 0 6px;
      }
      .kache-columns {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
        gap: 28px;
      }
      .kache-columns.single { grid-template-columns: minmax(0, 1fr); }
      h3 {
        margin: 0 0 8px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 500;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h3 span { letter-spacing: 0; text-transform: none; }
      .compact-row, .crate-label {
        display: flex;
        align-items: baseline;
        gap: 8px;
        min-width: 0;
      }
      .compact-row {
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .compact-row .path { max-width: 440px; }
      .row-value {
        margin-left: auto;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.75rem;
        white-space: nowrap;
      }
      .crate-row { padding: 4px 0 6px; }
      .crate-group { margin-bottom: 12px; }
      .crate-group-head {
        padding: 2px 0 1px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 3px;
      }
      .crate-group-head .profile { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; }
      .subcommand-split {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        column-gap: 28px;
        margin-top: 18px;
      }
      .subcommand-split > h3,
      .subcommand-split > .empty { grid-column: 1 / -1; }
      /* The label must not absorb the row's shrinkage: `.cmd` breaks anywhere,
         so a nowrap value wider than the column would clamp it to one
         character per line. Keep the label whole and let the value wrap. */
      .subcommand-split .cmd { max-width: 300px; flex-shrink: 0; }
      .subcommand-split .row-value {
        min-width: 0;
        text-align: right;
        white-space: normal;
      }
      .diskutil .est { font-size: 0.72rem; }
      .crate-name {
        min-width: 0;
        overflow: hidden;
        color: var(--ink);
        font-family: var(--mono);
        font-size: 0.78rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .profile {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 0.68rem;
      }
      .crate-meter {
        height: 3px;
        margin-top: 3px;
        border-radius: 999px;
        background: var(--line);
        overflow: hidden;
      }
      .crate-meter-fill {
        height: 100%;
        background: linear-gradient(90deg, rgba(227, 179, 65, 0.45), var(--accent));
      }
      .refreshing {
        display: inline-block;
        margin-left: 7px;
        color: var(--accent);
        font-size: 0.58rem;
        vertical-align: 0.12em;
        animation: pulse 1.4s ease-in-out infinite;
      }
      .error-line {
        margin-top: 12px;
        color: var(--bad);
        font-size: 0.84rem;
      }
      .drawer-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(16, 14, 11, 0.66);
        display: flex;
        justify-content: flex-end;
        z-index: 10;
      }
      .drawer {
        width: min(680px, 92vw);
        height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
        padding: 16px 18px 22px;
        background: var(--panel);
        border-left: 1px solid var(--line);
        box-shadow: -18px 0 40px rgba(0, 0, 0, 0.45);
      }
      .drawer-head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .drawer-head .ticket { font-size: 0.95rem; color: var(--accent); }
      .drawer-close {
        margin-left: auto;
        font-size: 0.8rem;
        line-height: 1.4;
      }
      .drawer-cmd {
        font-family: var(--mono);
        font-size: 0.82rem;
        word-break: break-all;
        margin-bottom: 8px;
      }
      .drawer-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px;
        margin-bottom: 10px;
      }
      .drawer-error {
        color: var(--bad);
        font-family: var(--mono);
        font-size: 0.78rem;
        white-space: pre-wrap;
        word-break: break-word;
        margin: 0 0 10px;
      }
      .drawer .output {
        margin: 0;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #100e0b;
        font-family: var(--mono);
        font-size: 0.74rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 3px;
        background: transparent;
        color: var(--accent);
        cursor: pointer;
        font: inherit;
        padding: 2px 7px;
      }
      button:hover { border-color: var(--accent); }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </head>
