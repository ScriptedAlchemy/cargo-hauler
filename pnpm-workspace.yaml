allowBuilds:
  msgpackr-extract: false
# agent-bundle is pinned as a pkg.pr.new preview (see package.json); the
# `@agent-bundle/runtime` preview depends on the same-commit preview tarball of
# `rsc-markdown-stream`, which is not on npm. pnpm 11 blocks URL-resolved
# transitive dependencies by default; remove this once agent-bundle is on npm.
blockExoticSubdeps: false
# Do not block brand-new npm publishes; CI and Renovate bump deps the same day.
minimumReleaseAge: 0
