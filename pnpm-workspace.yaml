allowBuilds:
  msgpackr-extract: false
# agent-bundle and `@agent-bundle/runtime` are dev-only build dependencies,
# bundled into dist and never installed by consumers. Their pkg.pr.new preview
# tarballs pull URL-resolved subdependencies, so exotic subdeps stay allowed.
blockExoticSubdeps: false
# Do not block brand-new npm publishes; CI and Renovate bump deps the same day.
minimumReleaseAge: 0
